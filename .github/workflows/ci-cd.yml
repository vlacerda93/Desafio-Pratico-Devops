name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feat/observabilidade-cicd ]
  pull_request:
    branches: [ main, develop, feat/observabilidade-cicd ]

defaults:
  run:
    working-directory: ./Observabilidade

jobs:
  sast:
    name: 1. SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run njsscan
        uses: ajinabraham/njsscan-action@master
        with:
          args: './Observabilidade'

  build:
    name: 2. Build Application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm run build

  lint:
    name: 3. Lint & Code Quality
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm run lint

  test:
    name: 4. Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm run test

  docker:
    name: 5. Build & Push to DockerHub
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./Observabilidade
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/desafio-pratico-devops:latest

  terraform:
    name: 6. Deploy Infra Terraform
    runs-on: ubuntu-latest
    needs: docker
    defaults:
      run:
        working-directory: ./Observabilidade/terraform
    services:
      localstack:
        image: localstack/localstack:3.8.1
        ports:
          - "4566:4566"
        env:
          SERVICES: ec2
          DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          LOCALSTACK_ACKNOWLEDGE_ACCOUNT_REQUIREMENT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Init & Apply
        run: |
          terraform init
          terraform apply -auto-approve