version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rental_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rentaldatabase
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: api_observabilidade
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://user:password@db:5432/rentaldatabase?schema=public"
    depends_on:
      - db